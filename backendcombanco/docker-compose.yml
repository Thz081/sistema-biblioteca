# Executar: docker compose -f backendcombanco/docker-compose.yml up -d --build
# Para duas ou mais réplicas, usar o PostgreSQL e os manifestos em k8s/.
services:
  biblioteca:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/biblioteca.db}
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - biblioteca-local-data:/app/data
    restart: unless-stopped
volumes:
  biblioteca-local-data:
