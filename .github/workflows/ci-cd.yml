
name: CI/CD - Sistema Biblioteca
run-name: CI / Release ${{ github.ref_name }} por @${{ github.actor }}

on:
  push:
    branches:
      - develop
      - main
      - ci-cd-final
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - develop

jobs:

  # ============================================================
  # TESTES FRONTEND
  # ============================================================

  frontend-tests:
    name: Testes Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-biblioteca/package-lock.json

      - name: Instalar dependências Frontend
        timeout-minutes: 5
        working-directory: frontend-biblioteca
        run: npm ci --no-audit --no-fund

      - name: Testes Frontend
        working-directory: frontend-biblioteca
        run: npm test


  # ============================================================
  # TESTES BACKEND
  # ============================================================

  backend-tests:
    name: Testes Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backendcombanco/requirements.txt

      - name: Instalar dependências Backend
        timeout-minutes: 5
        run: python -m pip install -r backendcombanco/requirements.txt

      - name: Testes Backend
        run: python -m pytest backendcombanco


  # ============================================================
  # AUDITORIA DE SEGURANÇA
  # ============================================================

  security-audit:
    name: Auditoria de Segurança
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detectar segredos com Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Auditoria de dependências Frontend
        working-directory: frontend-biblioteca
        run: npm audit --audit-level=high

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar pip-audit
        run: python -m pip install pip-audit

      - name: Auditoria de dependências Backend
        run: python -m pip_audit -r backendcombanco/requirements.txt


  # ============================================================
  # SAST - CODEQL
  # ============================================================

  codeql-analysis:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Executar análise CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"


  # ============================================================
  # DOCKER BUILD & PUSH (GHCR)
  # ============================================================

  docker:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - frontend-tests
      - backend-tests
      - security-audit
      - codeql-analysis

    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Converter OWNER para minúsculo
        run: |
          echo "repo_owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "image_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "image_version=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar no GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagem do Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backendcombanco
          file: ./backendcombanco/docker/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ env.repo_owner }}/biblioteca-backend:${{ env.image_version }}

      - name: Construir imagem do Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-biblioteca
          file: ./frontend-biblioteca/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ env.repo_owner }}/biblioteca-frontend:${{ env.image_version }}

      - name: Construir imagem unificada
        id: unified
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ env.repo_owner }}/biblioteca:${{ env.image_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
