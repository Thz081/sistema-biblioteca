name: CI/CD - Sistema Biblioteca
run-name: CI / Release ${{ github.ref_name }} por @${{ github.actor }}

on:
  push:
    branches:
      - develop
      - main
      - ci-cd-final
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - develop

jobs:

  # ============================================================
  # TESTES FRONTEND
  # ============================================================

  frontend-tests:
    name: Testes Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-biblioteca/package-lock.json

      - name: Instalar dependências Frontend
        timeout-minutes: 5
        working-directory: frontend-biblioteca
        run: npm ci --no-audit --no-fund

      - name: Testes Frontend
        working-directory: frontend-biblioteca
        run: npm test


  # ============================================================
  # TESTES BACKEND
  # ============================================================

  backend-tests:
    name: Testes Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backendcombanco/requirements.txt

      - name: Instalar dependências Backend
        timeout-minutes: 5
        run: python -m pip install -r backendcombanco/requirements.txt

      - name: Testes Backend
        run: python -m pytest backendcombanco


  # ============================================================
  # DOCKER BUILD & PUSH (GHCR)
  # ============================================================

  docker:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - frontend-tests
      - backend-tests

    permissions:
      contents: read
      packages: write

    steps:

      # 1. Baixar código
      - name: Baixar código
        uses: actions/checkout@v5

      # 2. Converter OWNER para minúsculo e definir versão
      - name: Converter OWNER para minúsculo
        run: |
          echo "repo_owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "image_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "image_version=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi

      # 3. Configurar Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 4. Autenticar no GHCR
      - name: Autenticar no GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Construir e publicar imagem unificada
      - name: Construir e publicar imagem unificada
        id: unified
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ env.repo_owner }}/biblioteca:${{ env.image_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
