apiVersion: batch/v1
kind: Job
metadata:
  name: biblioteca-init-db
  namespace: biblioteca
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init-db
          image: ghcr.io/thz081/biblioteca:0.1.3
          workingDir: /app
          command: ["python", "init_db.py"]
          envFrom:
            - secretRef:
                name: biblioteca-secrets
          env:
            - name: CREATE_INITIAL_ADMIN
              value: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL