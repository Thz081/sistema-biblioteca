# Executar uma Ãºnica vez antes de iniciar as rÃ©plicas da aplicaÃ§Ã£o.
apiVersion: batch/v1
kind: Job
metadata:
  name: biblioteca-init-db
  namespace: biblioteca
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init-db
          image: ghcr.io/thz081/biblioteca:0.1.3@sha256:d64db01742d0c72ad4059def5d8df1ad8e3e19601c18b362e7ef32a0d862eca9
          workingDir: /app/backendcombanco
          command: [python, -c]
          args:
            - |
              import asyncio
              from app.main import app, lifespan
              async def initialize():
                  async with lifespan(app):
                      print("Esquema e administrador do laboratÃ³rio inicializados.")
              asyncio.run(initialize())
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: biblioteca-secrets
          env:
            - name: CREATE_INITIAL_ADMIN
              value: "true"

